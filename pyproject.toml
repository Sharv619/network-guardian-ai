[project]
name = "network-guardian-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "requests>=2.31.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "google-api-python-client>=2.116.0",
    "google-auth>=2.27.0",
    "gspread>=5.12.0",
    "oauth2client>=4.1.3",
    "httpx>=0.28.1",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "python-json-logger>=2.0.7",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.22.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.2",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "stripe>=8.0.0",
    "psutil>=5.9.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["backend/tests/", "venv/"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
exclude = ["backend/tests/"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.vercel]
entrypoint = "backend.main:app"
