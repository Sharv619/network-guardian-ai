services:
  network-guardian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-guardian
    restart: always
    environment:
      - ENVIRONMENT=development
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NOTION_TOKEN=${NOTION_TOKEN}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
      - POLL_INTERVAL=${POLL_INTERVAL:-30}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SHEETS_CREDENTIALS=${GOOGLE_SHEETS_CREDENTIALS}
      - ADGUARD_URL=http://host.docker.internal:80
      - ADGUARD_USER=user
      - ADGUARD_PASS=user1234
      - GEMINI_LIVE_FEED_ENABLED=${GEMINI_LIVE_FEED_ENABLED:-true}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-nomic-embed-text}
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-llama3.2}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-mock}
    ports:
      - "8000:8000"
    volumes:
      - network_guardian_db:/app
      - ./backend:/app/backend:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: host

  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: always
    network_mode: host
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf

volumes:
  adguard_work:
  adguard_conf:
  network_guardian_db:

networks:
  network-guardian-net:
    driver: bridge
